<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c2410c" />
  <title>Menú</title>
  <meta name="description" content="Menú digital del restaurante" />

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./img/logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./img/logo.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../shared/styles/tokens.css" />
  <link rel="stylesheet" href="../shared/styles/base.css" />
  <link rel="stylesheet" href="./menu.css" />
</head>
<body>
  <header class="hero">
    <div class="container hero__inner">
      <img class="hero__logo" id="brand-logo" src="./img/logo.svg" alt="" width="56" height="56" />
      <div class="hero__text">
        <h1 class="hero__name" id="brand-name">Menú</h1>
        <p class="hero__slogan" id="brand-slogan"></p>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="container toolbar__inner">
      <div class="search" id="search-wrap">
        <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
        <input class="search__input" id="search" type="search" placeholder="Buscar plato…" autocomplete="off" aria-label="Buscar plato" />
      </div>
      <button class="btn-icon" id="refresh" type="button" aria-label="Actualizar menú">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>
        </svg>
      </button>
    </div>
  </div>

  <nav class="catnav" id="catnav" aria-label="Categorías"></nav>

  <main class="container" id="menu" aria-live="polite"></main>

  <footer class="footer">
    <div class="container">
      <p id="status"></p>
      <p class="footer__powered">Menú digital · Fapoz</p>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./menu.js"></script>
</body>
</html>
